<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="game-board">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
            </div>
            <div class="sidebar">
                <div class="info-panel">
                    <h1>TETRIS</h1>
                    <div class="score-container">
                        <h2>SCORE</h2>
                        <p id="score">0</p>
                    </div>
                    <div class="level-container">
                        <h2>LEVEL</h2>
                        <p id="level">1</p>
                    </div>
                    <div class="lines-container">
                        <h2>LINES</h2>
                        <p id="lines">0</p>
                    </div>
                    <div class="next-piece-container">
                        <h2>NEXT</h2>
                        <canvas id="nextPieceCanvas" width="120" height="120"></canvas>
                    </div>
                </div>
                <div class="controls">
                    <button id="startBtn" class="btn btn-primary">START GAME</button>
                    <button id="pauseBtn" class="btn btn-secondary" disabled>PAUSE</button>
                    <button id="resetBtn" class="btn btn-danger">RESET</button>
                </div>
                <div class="instructions">
                    <h3>CONTROLS</h3>
                    <ul>
                        <li>← → : Move</li>
                        <li>↑ : Rotate</li>
                        <li>↓ : Drop Fast</li>
                        <li>SPACE : Hard Drop</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="game-over-modal" id="gameOverModal">
            <div class="modal-content">
                <h2>GAME OVER</h2>
                <p>Final Score: <span id="finalScore">0</span></p>
                <p>Level: <span id="finalLevel">1</span></p>
                <p>Lines Cleared: <span id="finalLines">0</span></p>
                <button id="restartBtn" class="btn btn-primary">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script src="js/tetrominoes.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
